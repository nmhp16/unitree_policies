# Spin attack: one-shot move. G1 executes one full revolution in place at
# constant angular velocity with arms half-extended outward. Stylized move,
# fully synthetic — no external motion data needed.
#
# The hard part for the policy is not the upper-body pose (trivially held by
# joint tracking reward) but learning to pivot on flat ground at the commanded
# yaw rate. This is contact-rich foot manipulation that PPO will discover via
# the root_rot + root_ang_vel tracking reward.
#
# One-shot framing: the motion is non-loopable, episode_length_s matches
# seconds_per_revolution, and `motion_completed` terminates when phase=1.
# This matches the conceptual "one spin attack" rather than "spin forever".
#
# Tuning knobs to try first if convergence stalls:
#   - seconds_per_revolution: 3.0 (120°/s) is the default; clean spinning. Drop
#     to 2.0 (180°/s) only once the policy holds balance reliably at 3.0.
#   - shoulder_roll_out: 1.0 ≈ 57° (half-T) is the default. Larger values (1.5
#     ≈ 86°, near full T-pose) raise the moment of inertia about the spin axis
#     and make the spin harder to balance — only bump up once the robot can
#     reliably hold the half-T while spinning.
#   - root_threshold in terminations: spinning robots drift more than walking
#     ones; bump to 0.8 if early termination is firing too aggressively.

gym_id: Isaac-G1-Tracking-Spin-Attack-v0

motion:
  # Built-in sentinel — uses MotionReference.synthetic_spin_attack().
  # To customize seconds_per_revolution / shoulder_roll_out, generate an NPZ
  # by calling that classmethod directly and save the result, or edit the
  # defaults in envs/motion_reference.py.
  path: synthetic_spin_attack

episode:
  length_s: 3.0           # one full revolution at 3s/rev (120°/sec) — one-shot

scene:
  num_envs: 4096
  env_spacing: 3.0        # bigger spacing — spinning robots that drift collide

# Reward weights tuned for spinning:
#   - track_joint_pos UP: the arms-out pose IS the signature; if the policy
#     drops its arms the move loses identity even if the spin is good.
#   - track_root_rot HIGH and track_root_ang_vel HIGH: the spin IS the move.
#   - track_root_lin_vel kept ON (was tried at 0.0): the reference is 0 in xy,
#     so this term directly punishes sliding/drifting that root_pos tracking
#     alone is too slow to catch on a spinning base.
#   - track_joint_vel DOWN: pose is mostly static, joint velocity tracking
#     just adds noise.
#   - alive bumped 4×: surviving the spin matters disproportionately; without
#     this, early policies trade pose quality for staying upright too cheaply.
#   - upright added: yaw rotates freely under track_root_rot, so a separate
#     "head up" term is needed to keep the body vertical independent of yaw.
rewards:
  track_joint_pos: 4.0
  track_joint_vel: 0.3
  track_root_pos: 2.0
  track_root_rot: 4.0
  track_root_lin_vel: 1.0   # was 0.0 — punish sliding/drifting
  track_root_ang_vel: 4.0
  alive: 2.0                # was 0.5 — surviving the spin matters 4× more
  upright: 4.0              # new — keeps the robot vertical independent of yaw
  action_rate: -0.01
  torques: -0.000001

terminations:
  minimum_height: 0.3
  joint_threshold: 1.2
  root_threshold: 0.8    # bumped vs walk: spinning has natural drift
