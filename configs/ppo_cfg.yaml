# rsl_rl PPO hyperparameters for G1 motion tracking.
# These mirror the legged_gym / Isaac Lab manipulation baselines that work
# well for whole-body humanoid policies. Tune only after baseline converges.

algorithm: PPO
device: cuda
num_steps_per_env: 24          # rollout length per env between updates
max_iterations: 8000           # total PPO iterations; ~50-300M env steps total
save_interval: 200
empirical_normalization: true

# Network architecture
policy:
  class_name: ActorCritic
  init_noise_std: 1.0
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: elu

# PPO algorithm settings
algorithm_cfg:
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.005
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 1.0e-4
  schedule: adaptive            # adapt LR to target KL
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 1.0
