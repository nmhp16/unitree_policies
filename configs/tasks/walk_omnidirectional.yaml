# Omnidirectional Walking Task Configuration

task:
  name: "walk_omnidirectional"
  description: "Walk in any direction - forward, backward, sideways, and turning"
  
robot:
  model: "g1_12dof"
  
environment:
  max_episode_steps: 1000
  decimation: 4  # 50Hz control (200Hz physics / 4)
  
  # Full range of movement commands
  command:
    lin_vel_x: [-1.0, 1.5]   # Forward/backward
    lin_vel_y: [-0.8, 0.8]   # Left/right strafing
    ang_vel_z: [-1.0, 1.0]   # Turning
  
  # Domain randomization
  domain_rand:
    randomize_friction: true
    friction_range: [0.5, 1.25]
    randomize_mass: false
    mass_range: [-1.0, 1.0]
    push_robots: true
    push_interval_s: 15
    max_push_vel_xy: 1.0
  
  # Observation noise
  noise:
    add_noise: true
    noise_level: 1.0
    noise_scales:
      dof_pos: 0.01
      dof_vel: 1.5
      ang_vel: 0.2
      gravity: 0.05

rewards:
  # Track all velocity components (combined into single reward in env)
  tracking_lin_vel: 1.0      # Tracks both x and y velocity
  tracking_ang_vel: 0.6      # Track turning
  
  # Penalties
  lin_vel_z: -2.0
  ang_vel_xy: -0.05
  dof_acc: -2.5e-7
  action_rate: -0.01
  collision: -1.0
  torques: -0.00001
  
  # Gait
  feet_air_time: 1.0

training:
  total_timesteps: 8000000   # More complex task needs more training
  n_envs: 8
  
  learning_rate: 0.0003
  n_steps: 24
  batch_size: 192
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 1.0
  max_grad_norm: 1.0
  
  save_freq: 100000
  eval_freq: 50000
  
  policy:
    type: "MlpPolicy"
    net_arch:
      pi: [64, 64]  # Slightly larger for complex movements
      vf: [64, 64]
    activation: "elu"

termination:
  max_roll: 0.8
  max_pitch: 1.0
  collision: true
  timeout_steps: 1000
