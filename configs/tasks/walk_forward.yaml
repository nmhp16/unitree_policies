# Walking Forward Task Configuration

task:
  name: "walk_forward"
  description: "Train robot to walk forward at commanded speeds"
  
robot:
  model: "g1_12dof"  # Which robot variant to use
  
environment:
  max_episode_steps: 1000
  decimation: 4  # Control at 50Hz (200Hz physics / 4)
  
  # Command ranges (what speeds to train on)
  command:
    lin_vel_x: [0.0, 1.5]  # Forward speed (m/s)
    lin_vel_y: [0.0, 0.0]  # No lateral movement
    ang_vel_z: [0.0, 0.0]  # No turning
  
  # Domain randomization (for robust policies)
  domain_rand:
    randomize_friction: true
    friction_range: [0.5, 1.25]
    randomize_mass: false
    mass_range: [-1.0, 1.0]
    push_robots: true
    push_interval_s: 15
    max_push_vel_xy: 1.0
  
  # Observation noise (simulates sensor noise)
  noise:
    add_noise: true
    noise_level: 1.0
    noise_scales:
      dof_pos: 0.01
      dof_vel: 1.5
      ang_vel: 0.2
      gravity: 0.05
  
  # Observation space configuration
  observations:
    - angular_velocity       # 3D
    - projected_gravity      # 3D
    - commands              # 3D
    - dof_pos               # 12D
    - dof_vel               # 12D
    - last_actions          # 12D
    - gait_phase            # 2D (sin, cos)
    # Total: 47D
  
  # PD controller gains
  control:
    kp: [100, 100, 100, 150, 40, 40, 100, 100, 100, 150, 40, 40]
    kd: [2, 2, 2, 4, 2, 2, 2, 2, 2, 4, 2, 2]
  
  # Default joint positions (standing pose)
  default_joint_angles:
    left_leg: [-0.1, 0.0, 0.0, 0.3, -0.2, 0.0]
    right_leg: [-0.1, 0.0, 0.0, 0.3, -0.2, 0.0]

# Reward function weights (based on legged_gym reward structure)
rewards:
  # Primary objectives
  tracking_lin_vel: 1.0      # Track forward velocity command (exponential reward)
  tracking_ang_vel: 0.5      # Track angular velocity (0 for straight walk)
  
  # Penalties (negative weights)
  lin_vel_z: -2.0            # Penalize vertical movement (bouncing)
  ang_vel_xy: -0.05          # Penalize roll/pitch rotation (wobbling)
  dof_acc: -2.5e-7           # Penalize joint accelerations (smoothness)
  action_rate: -0.01         # Penalize rapid action changes (smoothness)
  collision: -1.0            # Penalize non-foot body contacts (falling)
  torques: -0.00001          # Penalize high torques (energy efficiency)
  
  # Gait rewards
  feet_air_time: 1.0         # Reward long steps (natural gait)
  
  # Disabled rewards (can be enabled if needed)
  # orientation: 0.0         # Stay upright (disabled in base config)
  # base_height: 0.0         # Maintain target height (disabled in base config)
  # dof_vel: 0.0             # Penalize joint velocities (disabled in base config)
  # stand_still: 0.0         # Penalize motion at zero command (disabled)

# Training hyperparameters
training:
  total_timesteps: 5000000
  n_envs: 8
  
  # PPO settings
  learning_rate: 0.0003
  n_steps: 24
  batch_size: 192  # 24 * 8
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 1.0
  max_grad_norm: 1.0
  
  # Callbacks
  save_freq: 100000
  eval_freq: 50000
  
  # Network architecture
  policy:
    type: "MlpPolicy"
    net_arch:
      pi: [32, 32]  # Actor
      vf: [32, 32]  # Critic
    activation: "elu"

# Termination conditions
termination:
  # Based on legged_robot.py check_termination()
  max_roll: 0.8        # Radians (~46 degrees)
  max_pitch: 1.0       # Radians (~57 degrees)
  collision: true      # Terminate on non-foot body contacts
  timeout_steps: 1000  # Max episode length
