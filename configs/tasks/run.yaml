# Running Task Configuration

task:
  name: "run"
  description: "Fast running - higher speeds than walking"
  
robot:
  model: "g1_12dof"
  
environment:
  max_episode_steps: 800  # Shorter - running is more unstable
  decimation: 4  # 50Hz control (200Hz physics / 4)
  
  command:
    lin_vel_x: [1.5, 3.5]   # Fast forward speeds only
    lin_vel_y: [0.0, 0.0]   # Straight running
    ang_vel_z: [0.0, 0.0]
  
  # Domain randomization
  domain_rand:
    randomize_friction: true
    friction_range: [0.5, 1.25]
    randomize_mass: false
    mass_range: [-1.0, 1.0]
    push_robots: true
    push_interval_s: 10  # More frequent for running
    max_push_vel_xy: 1.2
  
  # Observation noise
  noise:
    add_noise: true
    noise_level: 1.0
    noise_scales:
      dof_pos: 0.01
      dof_vel: 1.5
      ang_vel: 0.2
      gravity: 0.05

rewards:
  # Primary objectives
  tracking_lin_vel: 2.0      # High reward for speed!
  tracking_ang_vel: 0.5
  
  # Penalties (allow more dynamic motion for running)
  lin_vel_z: -1.0            # Some bouncing is natural for running
  ang_vel_xy: -0.1           # More lenient wobbling
  dof_acc: -1.0e-7           # Allow faster accelerations
  action_rate: -0.005        # Allow more dynamic actions
  collision: -1.0
  torques: -0.00001
  
  # Gait rewards
  feet_air_time: 1.5         # Reward longer flight phases (running)

training:
  total_timesteps: 6000000
  n_envs: 8
  
  learning_rate: 0.0002     # Slightly lower for stability
  n_steps: 24
  batch_size: 192
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.015           # More exploration for dynamic gaits
  vf_coef: 1.0
  max_grad_norm: 1.0
  
  save_freq: 100000
  eval_freq: 50000
  
  policy:
    type: "MlpPolicy"
    net_arch:
      pi: [64, 64]
      vf: [64, 64]
    activation: "elu"

termination:
  max_roll: 0.9             # More lenient for running dynamics
  max_pitch: 1.2            # Running has more pitch variation
  collision: true
  timeout_steps: 800
